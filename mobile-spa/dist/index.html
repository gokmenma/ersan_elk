<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e6eaef" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ersan Elektrik mobil yönetim uygulaması" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ersan Mobile" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icons/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <title>Ersan Mobile</title>
    <style>
      html[data-theme="dark"] { background: #0e1116; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #191d24;
        color: #f8fafc;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        transition: opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1), transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.48s;
      }
      #app-splash.is-hiding {
        opacity: 0;
        transform: scale(1.06);
        visibility: hidden;
        pointer-events: none;
      }
      .splash-stage-3d {
        position: relative;
        width: 156px;
        height: 156px;
        display: grid;
        place-items: center;
        perspective: 900px;
        opacity: 0;
        animation: splash-stage-entry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-glow {
        position: absolute;
        inset: -24px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(201, 151, 56, 0.35) 0%, rgba(255, 255, 255, 0.12) 48%, transparent 72%);
        filter: blur(14px);
        animation: splash-glow-pulse 2.6s ease-in-out infinite alternate;
      }
      .splash-orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.14);
        border-top-color: #c99738;
        border-right-color: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 20px rgba(201, 151, 56, 0.22);
        animation: splash-orbit-spin 3.2s linear infinite;
      }
      .splash-orbit--inner {
        inset: 12px;
        border: 1px dashed rgba(201, 151, 56, 0.35);
        border-bottom-color: #ffffff;
        animation: splash-orbit-spin-rev 4.4s linear infinite;
      }
      .splash-logo-card-3d {
        position: relative;
        width: 104px;
        height: 104px;
        border-radius: 24px;
        transform-style: preserve-3d;
        box-shadow: 0 22px 44px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.18);
        overflow: hidden;
        opacity: 0;
        animation: splash-logo-entry 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards, splash-logo-3d-motion 3.4s 0.75s ease-in-out infinite alternate;
      }
      .splash-logo-card-3d img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .splash-logo-card-3d::after {
        content: '';
        position: absolute;
        top: -40%;
        left: -120%;
        width: 75%;
        height: 180%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.58) 50%, transparent 100%);
        transform: rotate(28deg);
        animation: splash-logo-sheen 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }
      .splash-meta {
        margin-top: 26px;
        text-align: center;
        opacity: 0;
        animation: splash-meta-fade 0.7s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-kicker {
        display: block;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        color: #c99738;
        text-transform: uppercase;
      }
      .splash-title {
        display: block;
        margin-top: 5px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .splash-loader {
        width: 112px;
        height: 4px;
        margin: 18px auto 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .splash-loader i {
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c99738, #ffffff);
        animation: splash-bar-slide 1.15s ease-in-out infinite alternate;
      }
      @keyframes splash-stage-entry {
        0% { opacity: 0; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-logo-entry {
        0% { opacity: 0; transform: translateY(18px) scale(0.68) rotateY(-32deg) rotateX(18deg); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotateY(-10deg) rotateX(8deg); }
      }
      @keyframes splash-logo-3d-motion {
        0% { transform: translateY(-3px) rotateY(-12deg) rotateX(9deg) scale(1); box-shadow: 12px 22px 42px rgba(0, 0, 0, 0.55), 0 0 24px rgba(251, 191, 36, 0.22); }
        50% { transform: translateY(3px) rotateY(12deg) rotateX(-7deg) scale(1.03); box-shadow: -12px 24px 44px rgba(0, 0, 0, 0.58), 0 0 28px rgba(56, 189, 248, 0.24); }
        100% { transform: translateY(-2px) rotateY(-6deg) rotateX(11deg) scale(1.01); box-shadow: 6px 20px 38px rgba(0, 0, 0, 0.52), 0 0 22px rgba(251, 191, 36, 0.25); }
      }
      @keyframes splash-logo-sheen {
        0% { left: -120%; }
        55%, 100% { left: 165%; }
      }
      @keyframes splash-orbit-spin {
        to { transform: rotateX(22deg) rotateY(-12deg) rotateZ(360deg); }
      }
      @keyframes splash-orbit-spin-rev {
        to { transform: rotateX(-18deg) rotateY(15deg) rotateZ(-360deg); }
      }
      @keyframes splash-glow-pulse {
        0% { transform: scale(0.92); opacity: 0.72; }
        100% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes splash-meta-fade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-bar-slide {
        0% { transform: translateX(-15%); }
        100% { transform: translateX(125%); }
      }
    </style>
    <script>
      try {
        var theme = localStorage.getItem('ersan_mobile_theme_v1');
        if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1116');
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-CKO_yf0U.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BNmNJ2ux.css">
  </head>
  <body>
    <div id="app-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#191d24;color:#f8fafc;overflow:hidden;">
      <div class="splash-stage-3d" style="position:relative;width:156px;height:156px;max-width:156px;max-height:156px;display:grid;place-items:center;opacity:0;">
        <div class="splash-glow"></div>
        <div class="splash-orbit"></div>
        <div class="splash-orbit splash-orbit--inner"></div>
        <div class="splash-logo-card-3d" style="position:relative;width:104px;height:104px;max-width:104px;max-height:104px;border-radius:24px;overflow:hidden;opacity:0;">
          <img src="/images/logo-3d-splash.png?v=3" width="104" height="104" style="width:104px;height:104px;max-width:104px;max-height:104px;object-fit:cover;display:block;" alt="Ersan Elektrik" />
        </div>
      </div>
      <div class="splash-meta" style="margin-top:26px;text-align:center;opacity:0;">
        <span class="splash-kicker">ERSAN ELEKTRİK</span>
        <strong class="splash-title">Mobil Yönetim Sistemi</strong>
        <div class="splash-loader"><i></i></div>
      </div>
    </div>
    <div id="app"></div>
  </body>
</html>
